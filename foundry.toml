[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./out" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "morpho-blue/=lib/morpho-blue/src/",
  "morpho-blue-irm/=lib/morpho-blue-irm/src/",
]
# Mezo block headers lack blob gas fields, so forks fail on Cancun and later.
evm_version = "shanghai"

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"
